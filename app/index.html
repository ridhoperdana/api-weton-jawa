<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weton App</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif&display=swap');

        body {
            font-family: 'Noto Serif', serif;
            background-image: url('https://www.batikraft.id/wp-content/uploads/2020/01/batik-pattern-768x1024.jpg'); /* Example Batik pattern background */
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        .container {
            max-width: 450px;
            margin: 50px auto;
            padding: 25px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            text-align: center;
            border: 2px solid #C19A6B; /* Brown-Gold inspired color */
        }

        h2 {
            color: #8B4513; /* Dark brown color */
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            margin: 12px;
            background-color: #8B0000; /* Dark red inspired by Javanese batik */
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .btn:hover {
            background-color: #A52A2A; /* Softer red on hover */
        }

        .input-field {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #8B4513;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .result {
            margin-top: 20px;
            font-size: 18px;
            color: #8B4513; /* Consistent with the theme */
        }

        button:focus {
            outline: none;
        }
    </style>
</head>
<body>

<div class="container" id="menu">
    <h2>Menu Utama</h2>
    <button class="btn" onclick="showPasaranMenu()">Cari Pasaran</button>
    <button class="btn" onclick="showJodohMenu()">Cek Kecocokan Jodoh</button>
</div>

<div class="container" id="pasaran-menu" style="display: none;">
    <h2>Cari Weton Anda</h2>
    <input type="date" id="inputDate" class="input-field">
    <button class="btn" onclick="searchWeton()">Cari</button>
    <div class="result" id="result"></div>
    <div class="result" id="result-career"></div>
    <button class="btn" onclick="showMenu()">Kembali</button>
</div>

<div class="container" id="jodoh-menu" style="display: none;">
    <h2>Cek Kecocokan Jodoh</h2>
    <input type="date" id="pria-date" class="input-field" placeholder="Tanggal lahir pria">
    <input type="date" id="wanita-date" class="input-field" placeholder="Tanggal lahir wanita">
    <button class="btn" onclick="checkMatchValue()">Cek Kecocokan</button>
    <div class="result" id="jodoh-result"></div>
    <button class="btn" onclick="showMenu()">Kembali</button>
</div>

<script src="script.js"></script>
</body>
</html>
